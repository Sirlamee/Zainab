<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Zainab</title>
    <style>
        :root {
            --rose: #d94f83;
            --ink: #56324b;
            --petal: #fff7fb;
            --leaf: #9fc9a8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            color: var(--ink);
            background:
                radial-gradient(circle at 15% 20%, #ffe0ec 0 8%, transparent 9%),
                radial-gradient(circle at 85% 80%, #e5f5df 0 10%, transparent 11%),
                linear-gradient(135deg, #fff1f6, #f7efff 50%, #effbf0);
            font-family: Georgia, "Times New Roman", serif;
        }

        .message {
            position: relative;
            width: min(90vw, 720px);
            padding: 4rem 2rem;
            text-align: center;
            background: rgb(255 255 255 / 78%);
            border: 3px solid #fff;
            border-radius: 30px;
            box-shadow: 0 18px 45px rgb(125 67 103 / 18%);
        }

        .flowers {
            margin: 0 0 1rem;
            font-size: clamp(2rem, 7vw, 4rem);
            letter-spacing: .15em;
        }

        h1 {
            margin: 0;
            color: var(--rose);
            font-size: clamp(2.2rem, 7vw, 4.8rem);
            line-height: 1.05;
            text-shadow: 2px 3px 0 #ffd8e8;
        }

        .subtitle {
            margin: 1.4rem 0 0;
            color: var(--leaf);
            font-size: clamp(1.1rem, 3vw, 1.5rem);
            font-style: italic;
        }

        .corner {
            position: absolute;
            font-size: 2rem;
        }

        .top-left { top: 1rem; left: 1.2rem; }
        .top-right { top: 1rem; right: 1.2rem; }
        .bottom-left { bottom: 1rem; left: 1.2rem; }
        .bottom-right { right: 1.2rem; bottom: 1rem; }
    </style>
</head>
<body>
    <main class="message">
        <span class="corner top-left" aria-hidden="true">🌸</span>
        <span class="corner top-right" aria-hidden="true">🌷</span>
        <p class="flowers" aria-hidden="true">🌼 💐 🌹</p>
        <h1>ZAINAB IS THE MOST BEAUTIFUL GIRL IN THE WORLD</h1>
        <p class="subtitle">Inside and out, blooming brighter every day 💖</p>
        <span class="corner bottom-left" aria-hidden="true">🌻</span>
        <span class="corner bottom-right" aria-hidden="true">💮</span>
    </main>
</body>
</html>
